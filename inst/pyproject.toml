[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsldPy"
version = "2.0.0"
description = "Python wrappers around the R 'dsld' package via rpy2"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "A. Mittal, T. Abdullah, A. Ashok, B. Zarate Estrada, S. Martha, B. Ouattara, J. Tran, and N. Matloff"}
]
maintainers = [{name = "Aditya Mittal", email = "mittalaa@uci.edu"}]
license = "MIT"
license-files = ["src/dsldPy/LICENSE"]
keywords = ["dsld", "rpy2", "fair machine learning", "statistics", "confounder analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=1.1",
  "numpy>=1.20",
  "Pillow>=8",
  "pyreadr>=0.4",
  "rpy2>=3.5",
  "plotly>=5",
  "ipython>=7",
]

[project.optional-dependencies]
examples = ["nbformat", "scikit-learn", "nbclient", "ipykernel"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
